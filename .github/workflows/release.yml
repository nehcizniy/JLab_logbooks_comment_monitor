name: Publish extension release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Resolve and verify release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./manifest.json').version")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          test "$VERSION" = "$PACKAGE_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$TAG" = "$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Manual releases must run from the main branch." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Ensure the manual release is new
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists. Increase the version in manifest.json and package.json first." >&2
            exit 1
          fi
      - run: npm run check
      - run: npm test
      - run: npm run package
      - name: Create and push the manual release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "JLab Logbook Comment Monitor $TAG"
          git push origin "$TAG"
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --generate-notes --title "JLab Logbook Comment Monitor $TAG"
          fi
