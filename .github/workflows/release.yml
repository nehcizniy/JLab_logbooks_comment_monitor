name: Publish extension release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tag matches manifest
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - run: npm run check
      - run: npm test
      - run: npm run package
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "JLab Logbook Comment Monitor $GITHUB_REF_NAME"
